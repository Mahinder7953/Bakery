spring:
  application:
    name: Api-Gateway-Service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
#          lower-case-service-id: true

server:
  port: 8087

eureka: 
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

jwt:
  secret: MySuperLongSecretKeyForJwtTokenGeneration1234567890
